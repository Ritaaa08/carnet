  ${legend()}
  ${ui.plan && ui.agMode !== "month" ? `<div class="banner"><span><b>${ui.plan.sessions.filter(s => s.on).length} sessions proposées</b> en pointillés. Rien n'est ajouté tant que tu ne valides pas.</span><span class="row"><button class="btn sm" type="button" data-action="plan-clear">Effacer</button><button class="btn sm primary" type="button" data-action="plan-open">Valider</button></span></div>` : ""}
  ${body}
  <p class="small muted">${ui.agMode === "month" ? "Touche un jour pour voir son détail. Les traits de couleur montrent les activités du jour." : "Touche une zone vide pour ajouter un rendez-vous à cette heure. Touche un cours ou un service pour le modifier juste ce jour-là."}</p>`;
}

/* ---------- À faire ---------- */
function taskRow(t) {
  const u = urgency(t), p = taskProgress(t), tt = TASK_TYPES[t.type] || TASK_TYPES.devoir;
  const subj = t.subjectId ? S.subjects.find(s => s.id === t.subjectId)?.name : "";
  const cli = t.clientId ? S.clients.find(c => c.id === t.clientId)?.name : "";
  return `<div class="task ${t.status === "done" ? "done" : ""}" data-cat="${tt.cat}">
    <button type="button" class="check ${t.status === "done" ? "on" : ""}" data-action="toggle-task" data-id="${t.id}" aria-label="${t.status === "done" ? "Rouvrir" : "Marquer comme terminé"}">${t.status === "done" ? ICON.check : ""}</button>
    <div style="min-width:0"><button type="button" class="t" data-action="open-task" data-id="${t.id}">${t.star ? '<span class="accent">★</span> ' : ""}${esc(t.title)}</button>
      <div class="meta">${catChip(tt.cat, tt.label)}${subj || cli ? `<span>${esc(subj || cli)}</span>` : ""}
        ${t.due ? `<span class="num">${fmtShort(t.due)}</span>` : ""}
        ${t.estimate ? `<span class="num">environ ${fmtDur(t.estimate * 60)}</span>` : ""}
        ${t.comments?.length ? `<span>${t.comments.length} note${t.comments.length > 1 ? "s" : ""}</span>` : ""}
        ${p > 0 && t.status !== "done" ? `<span class="pbar"><i style="width:${p}%"></i></span><span class="num">${p} %</span>` : ""}</div></div>
    <span class="chip ${u.cls}">${u.label}</span></div>`;
}
function viewTasks() {
  const F = { all: () => true, ecole: t => ["devoir", "projet", "examen", "test", "presentation"].includes(t.type), rattrapage: t => t.type === "rattrapage", client: t => t.type === "client", emploi: t => t.type === "emploi", perso: t => t.type === "perso" };
  const list = S.tasks.filter(F[ui.taskFilter] || F.all);
  const open = list.filter(t => t.status !== "done").sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || urgency(b).score - urgency(a).score);
  const t = todayISO(), in7 = iso(addDays(new Date(), 7));
  const groups = [
    ["En retard", open.filter(x => x.due && x.due < t)],
    ["Cette semaine", open.filter(x => x.due && x.due >= t && x.due <= in7)],
    ["Plus tard", open.filter(x => x.due && x.due > in7)],
    ["Sans date", open.filter(x => !x.due)],
  ];
  if (ui.showDone) groups.push(["Terminées", list.filter(x => x.status === "done").sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""))]);
  const filters = [["all", "Tout"], ["ecole", "École", "etude"], ["rattrapage", "Rattrapage", "etude"], ["client", "Clients", "client"], ["emploi", "Emploi", "emploi"], ["perso", "Perso", "perso"]];
  const totalRem = open.reduce((n, x) => n + taskRemainingMin(x), 0);
  return `
  <header class="ph"><div><h1>À faire</h1>
    <p class="sub num">${open.length} en cours${totalRem ? `, ${fmtDur(totalRem)} de travail à placer dans l'agenda` : ""}</p></div>
    <div class="row"><button class="btn" type="button" data-action="plan">Planifier</button><button class="btn primary" type="button" data-action="new-task">Nouvelle échéance</button></div></header>
  <div class="row between"><div class="pills">${filters.map(([k, l, c]) => `<button type="button" class="${ui.taskFilter === k ? "on" : ""}" ${c ? `data-cat="${c}"` : ""} data-action="task-filter" data-v="${k}">${c ? "<i></i>" : ""}${l}</button>`).join("")}</div>
    <label class="row small" style="gap:8px;min-height:40px"><input type="checkbox" id="show-done" data-action="show-done" ${ui.showDone ? "checked" : ""} style="width:18px;height:18px"> Afficher les terminées</label></div>
  <section class="card">${groups.some(g => g[1].length) ? groups.filter(g => g[1].length).map(([l, arr]) => `<h3 class="group-h">${l} <small class="num">${arr.length}</small></h3><div class="tasks">${arr.map(taskRow).join("")}</div>`).join("")
    : `<div class="empty"><b>Rien à faire pour l'instant.</b><span>Ajoute ton prochain devoir, test ou présentation. Le planificateur proposera ensuite des sessions dans tes créneaux libres.</span><button class="btn sm primary" type="button" data-action="new-task">Nouvelle échéance</button></div>`}</section>`;
}
</script>


<script>
"use strict";
/* =========================================================
   10. Rendu : Projets (études, clients, emploi) et Réglages
   ========================================================= */
function checklistHTML(list, scope, id) {
  return `<div class="cl-wrap" data-cl="${scope}:${id}"><div class="checklist">${(list || []).map(c => `<label class="ci ${c.done ? "done" : ""}"><input type="checkbox" ${c.done ? "checked" : ""} data-action="ci-toggle" data-scope="${scope}" data-id="${id}" data-ci="${c.id}"><span>${esc(c.text)}</span><button type="button" class="x" data-action="ci-del" data-scope="${scope}" data-id="${id}" data-ci="${c.id}" aria-label="Supprimer ${esc(c.text)}">×</button></label>`).join("")}</div>
  <div class="add-inline" style="margin-top:6px"><input class="input" placeholder="Ajouter un élément" autocomplete="off" aria-label="Nouvel élément"><button class="btn sm" type="button" data-action="ci-add" data-scope="${scope}" data-id="${id}">Ajouter</button></div></div>`;
}
function nextEventFor(field, id) {
  const t = todayISO(); return S.events.filter(e => e[field] === id && e.date >= t).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))[0];
}
function viewProjects() {
  const tabs = [["etudes", "Études"], ["clients", "Clients"], ["emploi", "Emploi"]];
  const body = { etudes: projEtudes, clients: projClients, emploi: projEmploi }[ui.projTab]();
  return `<header class="ph"><div><h1>Mes <em>projets</em></h1></div></header>
    <nav class="tabs-ed" aria-label="Type de projet">${tabs.map(([k, l]) => `<button type="button" class="${ui.projTab === k ? "on" : ""}" data-action="proj-tab" data-v="${k}">${l}</button>`).join("")}</nav>${body}`;
}
function projEtudes() {
  const t = todayISO();
  const cards = S.subjects.map(s => {
    const p = subjectProgress(s), left = (s.catchup || []).filter(c => !c.done).length;
    const tasks = openTasks().filter(x => x.subjectId === s.id).sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
    const nx = nextEventFor("subjectId", s.id);
    return `<article class="card pcard" data-cat="etude">
      <div class="row between" style="align-items:flex-start"><h3>${esc(s.name)}</h3>${left ? `<span class="chip soon">${left} à rattraper</span>` : `<span class="chip okc">À jour</span>`}</div>
      <div class="big num">${p}<sup>%</sup></div>
      <div class="thin"><i style="width:${p}%"></i></div>
      ${s.target ? `<div class="kv"><span>À jour pour le</span><span class="num">${fmtShort(s.target)}${s.target >= t ? `, J-${daysBetween(t, s.target)}` : ""}</span></div>` : ""}
      ${nx ? `<div class="kv"><span>Prochaine session</span><span class="num">${fmtShort(nx.date)}, ${fmtT(nx.start)}</span></div>` : ""}
      ${checklistHTML(s.catchup, "subject", s.id)}
      ${tasks.length ? `<div><div class="label" style="margin-bottom:6px">Échéances</div>${tasks.map(x => `<div class="kv" style="padding:5px 0"><button type="button" class="link" style="color:var(--ink);text-align:left" data-action="open-task" data-id="${x.id}">${esc(x.title)}</button><span class="chip ${urgency(x).cls}">${urgency(x).label}</span></div>`).join("")}</div>` : ""}
      ${s.notes ? `<p class="small muted" style="white-space:pre-wrap">${esc(s.notes)}</p>` : ""}
      <div class="row"><button class="btn sm" type="button" data-action="open-subject" data-id="${s.id}">Modifier</button><button class="btn sm soft" type="button" data-action="new-task" data-subject="${s.id}">Nouvelle échéance</button></div>
    </article>`;
  }).join("");
  return `<div class="row between"><p class="muted" style="max-width:60ch">Note ce qu'il te reste à rattraper par matière : chapitres, TP, cours manqués. Le planificateur les place dans ton temps libre, environ ${fmtDur(S.settings.itemMin)} par élément.</p>
    <button class="btn primary" type="button" data-action="open-subject" data-id="">Ajouter une matière</button></div>
  ${S.subjects.length ? `<div class="cards">${cards}</div>` : `<div class="empty"><b>Aucune matière pour l'instant.</b><span>Ajoute les cours où tu as du retard pour suivre ton rattrapage.</span></div>`}
  ${interlude()}`;
}
function projClients() {
  const cards = S.clients.map(c => {
    const st = c.stage || 0, nx = nextEventFor("clientId", c.id);
    const d = c.deadline ? daysBetween(todayISO(), c.deadline) : null;
    return `<article class="card pcard" data-cat="client">
      <div class="row between" style="align-items:flex-start"><div style="min-width:0"><h3>${esc(c.name)}</h3>${c.project ? `<p class="muted">${esc(c.project)}</p>` : ""}</div>${catChip("client", CLIENT_STAGES[st])}</div>
      <div class="steps">${CLIENT_STAGES.map((l, i) => `<button type="button" class="${i <= st ? "on" : ""} ${i === st ? "cur" : ""}" data-action="client-stage" data-id="${c.id}" data-v="${i}" aria-label="Étape ${l}"><i></i>${l}</button>`).join("")}</div>
      ${c.deadline ? `<div class="kv"><span>Livraison</span><span class="num">${fmtShort(c.deadline)} ${st < 4 ? `<span class="chip ${d < 0 ? "urgent" : d <= 7 ? "soon" : ""}">${d < 0 ? "dépassée" : "J-" + d}</span>` : ""}</span></div>` : ""}
      ${c.budget ? `<div class="kv"><span>Budget</span><span class="num">${esc(c.budget)}</span></div>` : ""}
      <div class="kv"><span>Facturation</span><span>${INVOICE[c.invoice || "none"]}</span></div>
      <div class="kv"><span>Prochain RDV</span><span class="num">${nx ? `${fmtShort(nx.date)}, ${fmtT(nx.start)}` : "à caler"}</span></div>
      ${checklistHTML(c.checklist, "client", c.id)}
      <div class="row"><button class="btn sm" type="button" data-action="open-client" data-id="${c.id}">Ouvrir</button><button class="btn sm soft" type="button" data-action="find-slot" data-client="${c.id}">Caler un RDV</button></div>
    </article>`;
  }).join("");
  return `<div class="row between"><p class="muted" style="max-width:60ch">Tes projets web : étape, livraison, facturation et prochain rendez-vous. Touche une étape pour faire avancer le projet.</p>
    <button class="btn primary" type="button" data-action="open-client" data-id="">Nouveau client</button></div>
  ${S.clients.length ? `<div class="cards">${cards}</div>` : `<div class="empty"><b>Aucun client enregistré.</b><span>Ajoute tes 3 clients en cours pour suivre leurs projets.</span></div>`}
  ${interlude()}`;
}
function projEmploi() {
  const t = todayISO();
  const cols = JOB_STAGES.map(([k, l]) => {
    const js = S.jobs.filter(j => (j.stage || "cible") === k).sort((a, b) => (a.nextDate || "9").localeCompare(b.nextDate || "9"));
    return `<div class="kcol"><div class="kcol-h"><b>${l}</b><span class="small muted num">${js.length}</span></div>
      ${js.map(j => {
        const late = k === "envoyee" && j.date && daysBetween(j.date, t) >= 7 && !j.nextDate;
        return `<button type="button" class="jcard" data-cat="emploi" data-action="open-job" data-id="${j.id}"><b>${esc(j.company)}</b>${j.role ? `<span class="small muted">${esc(j.role)}</span>` : ""}
        ${j.nextAction || j.nextDate ? `<span class="chip ${j.nextDate && j.nextDate <= t ? "urgent" : ""}">${esc(j.nextAction || "Action")}${j.nextDate ? ", " + fmtShort(j.nextDate) : ""}</span>` : ""}
        ${late ? `<span class="chip soon">À relancer</span>` : ""}</button>`;
      }).join("")}</div>`;
  }).join("");
  const sent = S.jobs.filter(j => j.stage && j.stage !== "cible").length, itw = S.jobs.filter(j => ["entretien", "offre"].includes(j.stage)).length;
  return `<div class="row between"><p class="muted num" style="max-width:60ch">${sent} candidature${sent > 1 ? "s" : ""} envoyée${sent > 1 ? "s" : ""}, ${itw} entretien${itw > 1 ? "s" : ""} ou offre${itw > 1 ? "s" : ""}. Sans réponse après 7 jours, une candidature passe en « À relancer ».</p>
    <button class="btn primary" type="button" data-action="open-job" data-id="">Nouvelle candidature</button></div>
  ${S.jobs.length ? `<div class="kanban">${cols}</div>` : `<div class="empty"><b>Ta recherche commence ici.</b><span>Ajoute les annonces qui t'intéressent, même avant de postuler.</span></div>`}
  ${interlude()}`;
}

/* ---------- Réglages ---------- */
function qrSVG(text) {
  if (typeof qrcode !== "function") return `<p class="small muted">QR code indisponible : utilise le lien.</p>`;
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch { return ""; }
}
function viewSettings() {
  const st = S.settings;
  const num = (k, label, step, unit) => `<label class="field"><span>${label}</span><div class="row" style="gap:8px;flex-wrap:nowrap"><input class="input num" type="number" inputmode="decimal" step="${step}" min="0" id="set-${k}" data-set="${k}" value="${esc(st[k])}"><span class="small muted">${unit}</span></div></label>`;
  const routine = S.routine.map(r => `<div class="routine-row" data-cat="${r.cat}"><div style="min-width:0"><b>${esc(r.title)}</b><div class="small muted num">${DOW_ORDER.filter(d => r.days.includes(d)).map(d => DOW[d]).join(", ")}, ${fmtT(r.start)} à ${fmtT(r.end)}</div></div><button class="btn sm" type="button" data-action="open-routine" data-id="${r.id}">Modifier</button></div>`).join("");
  const breaks = S.breaks.map(b => `<div class="kv" style="padding:10px 0"><span>${esc(b.label || "Vacances")}</span><span class="num">${fmtShort(b.from)} au ${fmtShort(b.to)} <button class="btn sm ghost" type="button" data-action="del-break" data-id="${b.id}">Retirer</button></span></div>`).join("");
  return `
  <header class="ph"><div><h1>Mes <em>réglages</em></h1><p class="sub">Ton rythme, ton style, ta sécurité.</p></div></header>
  <div class="g12">
    <div class="s6" style="display:flex;flex-direction:column;gap:24px">
      <section class="card"><div class="sec-head"><h2 class="h2">Mon <em>style</em></h2></div>
        <div class="photo-pick"><div class="photo-thumb">${photoURL ? `<img src="${photoURL}" alt="Photo d'ambiance actuelle">` : esc((st.name || "Carnet").slice(0, 1))}</div>
          <div style="display:flex;flex-direction:column;gap:10px"><p class="small muted">Ta photo de couverture sur l'accueil. Elle est chiffrée comme le reste.</p>
          <div class="row"><label class="btn sm primary" for="photo-file">${photoURL ? "Changer" : "Choisir une photo"}</label>${photoURL ? `<button class="btn sm" type="button" data-action="photo-remove">Retirer</button>` : ""}</div></div></div>
        <label class="field" style="margin-top:20px"><span>Prénom affiché en couverture</span><input class="input" id="set-name" data-set="name" value="${esc(st.name)}" autocomplete="given-name"></label>
        <label class="field" style="margin-top:16px"><span>Mes phrases (une par ligne)</span><textarea class="input" id="set-phrases" data-set="phrases" placeholder="Ex. Je vise le bachelor avec mention.">${esc(st.phrases || "")}</textarea></label>
        <p class="small muted" style="margin-top:8px">Elles s'ajoutent aux phrases qui défilent et aux affirmations du jour.</p></section>
      <section class="card"><div class="sec-head"><h2 class="h2">Mes <em>couleurs</em></h2></div>
        <p class="small muted" style="margin-bottom:16px">Choisis la couleur de chaque activité. Elle s'applique partout : journée, semaine, échéances, projets.</p>
        <div class="colors">${Object.keys(CATS).map(k => { const cur = (st.colors || {})[k] || DEFAULT_COLORS[k]; return `<div class="color-row" data-cat="${k}"><span><i></i>${CATS[k].label}</span><div class="swatches" role="group" aria-label="Couleur ${CATS[k].label}">${Object.entries(SWATCHES).map(([sk, s]) => `<button type="button" style="--sw:${s.f}" class="${cur === sk ? "on" : ""}" data-action="set-color" data-k="${k}" data-v="${sk}" aria-label="${s.n}" aria-pressed="${cur === sk}" title="${s.n}"></button>`).join("")}</div></div>`; }).join("")}</div></section>
      <section class="card"><div class="sec-head"><h2 class="h2">Ma <em>routine</em></h2><button class="btn sm" type="button" data-action="open-routine" data-id="">Ajouter</button></div>
        <p class="small muted" style="margin-bottom:14px">Ce qui revient chaque semaine. Pour un changement ponctuel, touche le bloc dans la vue Semaine.</p>
        <div style="display:flex;flex-direction:column;gap:10px">${routine || `<div class="empty"><span>Aucune routine.</span></div>`}</div></section>
      <section class="card"><div class="sec-head"><h2 class="h2">Mes <em>vacances</em></h2></div>
        <p class="small muted">Pendant ces périodes, les cours disparaissent et le temps devient libre.</p>
        ${breaks}
        <form data-form="add-break" class="grid3" style="margin-top:14px;align-items:end">
          <label class="field"><span>Nom</span><input class="input" name="label" placeholder="Vacances d'automne"></label>
          <label class="field"><span>Du</span><input class="input" type="date" name="from" required></label>
          <label class="field"><span>Au</span><input class="input" type="date" name="to" required></label>
          <button class="btn sm" type="submit">Ajouter</button></form></section>
    </div>
    <div class="s6" style="display:flex;flex-direction:column;gap:24px">
      <section class="card"><div class="sec-head"><h2 class="h2">Mes <em>journées</em></h2><button class="btn sm" type="button" data-action="wiz-open">Refaire le questionnaire</button></div>
        <div class="grid2">
          <label class="field"><span>Début</span><input class="input" type="time" id="set-dayStart" data-set="dayStart" value="${st.dayStart}"></label>
          <label class="field"><span>Fin</span><input class="input" type="time" id="set-dayEnd" data-set="dayEnd" value="${st.dayEnd}"></label>
          ${num("travel", "Trajet", 5, "min")}
          ${num("minSlot", "Créneau minimum", 5, "min")}
          ${num("maxFocus", "Travail perso max / jour", 0.5, "h")}
          ${num("maxSession", "Session max", 0.5, "h")}
          ${num("itemMin", "Temps par élément à rattraper", 15, "min")}
          ${num("lockMin", "Verrouillage auto", 1, "min")}
        </div></section>
      ${store.mode === "cloud" ? `<section class="card"><div class="sec-head"><h2 class="h2">Mes appareils</h2></div>
        <p class="small muted" style="margin-bottom:14px">Pour ouvrir ton carnet sur ton téléphone : scanne ce code avec l'appareil photo, ou envoie-toi le lien. Si tu as installé l'app sur l'écran d'accueil, colle le lien dans « Tu as déjà un carnet ? ».</p>
        <div class="sync-box"><div class="qr" aria-label="QR code de synchronisation">${qrSVG(store.syncLink())}</div>
          <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><label class="field"><span>Lien de synchronisation</span><input class="input" id="sync-link" readonly value="${esc(store.syncLink())}"></label>
          <div><button class="btn sm" type="button" data-action="copy-sync">Copier le lien</button></div></div></div>
        <p class="small muted" style="margin-top:12px">Garde ce lien pour toi. Sans ton mot de passe il ne permet de rien lire, mais il mène à ton carnet chiffré.</p></section>` : ""}
      <section class="block-blush"><div class="sec-head"><h2 class="h2">Mon <em>coffre</em></h2></div>
        <p class="small" style="margin-bottom:16px">Tout est chiffré avec ton mot de passe avant d'être enregistré${store.mode === "cloud" ? " sur ton compte Supabase" : ""}. Sans lui, personne ne peut lire ton carnet, même avec le lien. Il ne peut pas être récupéré.</p>
        <form data-form="change-pw" style="display:flex;flex-direction:column;gap:12px">
          <label class="field"><span>Mot de passe actuel</span><input class="input" type="password" name="old" autocomplete="current-password" required></label>
          <div class="grid2 stack-sm"><label class="field"><span>Nouveau</span><input class="input" type="password" name="pw1" autocomplete="new-password" minlength="6" required></label>
          <label class="field"><span>Confirmer</span><input class="input" type="password" name="pw2" autocomplete="new-password" minlength="6" required></label></div>
          <div class="lock-err" id="pw-msg"></div>
          <div><button class="btn" type="submit">Changer le mot de passe</button></div></form></section>
      <section class="card"><div class="sec-head"><h2 class="h2">Ma <em>sauvegarde</em></h2></div>
        <p class="small muted" style="margin-bottom:14px">Une copie de secours en fichier, non chiffrée : garde-la dans un endroit sûr.</p>
        <div class="row"><button class="btn" type="button" data-action="export">Télécharger</button>
          <label class="btn" for="import-file">Importer</label><input type="file" id="import-file" accept=".json,application/json" hidden></div>
        <div class="row" style="margin-top:14px"><button class="btn sm ghost" type="button" data-action="archive">Faire le ménage (terminé depuis 60 jours)</button></div>
        <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)" id="reset-zone"><button class="btn sm danger" type="button" data-action="reset-ask">Tout effacer</button></div></section>
    </div>
  </div>`;
}
</script>


<script>
"use strict";
/* =========================================================
   11. Tiroirs d'édition
   ========================================================= */
let drawerCtx = null;
function openDrawer({ title, eyebrow = "", body, foot = "", onSubmit = null }) {
  $("#overlay").innerHTML = `<div class="scrim" data-action="scrim"><form class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <div class="drawer-head"><div style="min-width:0"><div class="label">${eyebrow}</div><h2>${esc(title)}</h2></div><button type="button" class="icon-btn" data-action="close" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body">${body}</div>${foot ? `<div class="drawer-foot">${foot}</div>` : ""}</form></div>`;
  drawerCtx = { onSubmit };
  setTimeout(() => { const f = $("#drawer [autofocus]"); if (f && window.innerWidth > 640) f.focus(); }, 60);
}
function closeDrawer() { $("#overlay").innerHTML = ""; drawerCtx = null; }
const fv = (form, n) => (form.elements[n]?.value ?? "").trim();
const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur ?? "") ? "selected" : ""}>${esc(l)}</option>`;
const catSelect = (cur, name = "cat") => `<select class="input" name="${name}" id="f-${name}">${Object.entries(CATS).map(([k, v]) => opt(k, v.label, cur)).join("")}</select>`;
const footSave = (exists, delAction) => `<span>${exists ? `<button type="button" class="btn sm danger" data-action="${delAction}">Supprimer</button>` : ""}</span><span class="row"><button type="button" class="btn" data-action="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></span>`;
function commentsBlock(item, scope) {
  if (!item) return "";
  return `<div class="field"><span>Commentaires</span><div class="comments" id="cm-list">${commentsList(item, scope)}</div>
    <textarea class="input" id="cm-text" placeholder="Note, compte-rendu, idée…" style="min-height:64px"></textarea>
    <div><button type="button" class="btn sm" data-action="add-comment" data-scope="${scope}" data-id="${item.id}">Ajouter le commentaire</button></div></div>`;
}
function commentsList(item, scope) {
  const fmt = s => new Intl.DateTimeFormat(LOC, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(s));
  return (item.comments || []).slice().reverse().map(c => `<div class="cm"><small><span>${fmt(c.at)}</span><button type="button" data-action="del-comment" data-scope="${scope}" data-id="${item.id}" data-c="${c.id}">Supprimer</button></small><p>${esc(c.text)}</p></div>`).join("");
}
const coll = scope => ({ event: S.events, task: S.tasks, client: S.clients, job: S.jobs, subject: S.subjects }[scope]);
const findIn = (scope, id) => coll(scope)?.find(x => x.id === id);
function confirmDelete(btn, fn) {
  if (btn.dataset.armed) return fn();
  btn.dataset.armed = "1"; btn.textContent = "Confirmer la suppression";
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = "Supprimer"; } }, 4000);
}

/* ---------- Événement ---------- */
function linkSelect(e) {
  const cur = e.taskId ? "task:" + e.taskId : e.clientId ? "client:" + e.clientId : e.jobId ? "job:" + e.jobId : e.subjectId ? "subject:" + e.subjectId : "";
  const grp = (label, arr, p, nm) => arr.length ? `<optgroup label="${label}">${arr.map(x => opt(p + ":" + x.id, nm(x), cur)).join("")}</optgroup>` : "";
  return `<select class="input" name="link" id="f-link">${opt("", "Aucun", cur)}${grp("Clients", S.clients, "client", x => x.name)}${grp("Candidatures", S.jobs, "job", x => x.company + (x.role ? " · " + x.role : ""))}${grp("Échéances", openTasks().concat(S.tasks.filter(t => t.id === e.taskId && t.status === "done")), "task", x => x.title)}${grp("Matières", S.subjects, "subject", x => x.name)}</select>`;
}
function openEvent(id, pre = {}) {
  const ex = id ? S.events.find(e => e.id === id) : null;
  const e = ex || { title: "", cat: "perso", date: todayISO(), start: "18:00", end: "19:00", place: "", notes: "", ...pre };
  openDrawer({
    eyebrow: ex ? "Événement" : "Nouvel événement", title: ex ? e.title : "Ajouter au planning",
    body: `<label class="field"><span>Titre</span><input class="input" name="title" value="${esc(e.title)}" placeholder="RDV client, entretien, révision…" required autofocus></label>
      <div class="grid2"><label class="field"><span>Catégorie</span>${catSelect(e.cat)}</label><label class="field"><span>Date</span><input class="input" type="date" name="date" value="${e.date}" required></label>
      <label class="field"><span>Début</span><input class="input" type="time" name="start" value="${e.start}" required></label><label class="field"><span>Fin</span><input class="input" type="time" name="end" value="${e.end}" required></label></div>
      <label class="field"><span>Lieu ou lien visio</span><input class="input" name="place" value="${esc(e.place || "")}"></label>
      <label class="field"><span>Lié à</span>${linkSelect(e)}</label>
      <label class="field"><span>Notes</span><textarea class="input" name="notes">${esc(e.notes || "")}</textarea></label>
      ${ex ? `<label class="row" style="min-height:44px"><input type="checkbox" name="done" ${e.done ? "checked" : ""} style="width:20px;height:20px"> Fait</label>` : ""}
      ${commentsBlock(ex, "event")}`,
    foot: footSave(!!ex, "del-event:" + (ex?.id || "")),
    onSubmit(f) {
      const start = fv(f, "start"), end = fv(f, "end");
      if (!fv(f, "title") || !fv(f, "date") || !start || !end) return toast("Titre, date et horaires sont nécessaires.");
      if (toMin(end) <= toMin(start)) return toast("L'heure de fin doit être après l'heure de début.");
      const [lt, lid] = fv(f, "link").split(":");
      const data = { title: fv(f, "title"), cat: fv(f, "cat"), date: fv(f, "date"), start, end, place: fv(f, "place"), notes: fv(f, "notes"),
        taskId: lt === "task" ? lid : "", clientId: lt === "client" ? lid : "", jobId: lt === "job" ? lid : "", subjectId: lt === "subject" ? lid : "", done: !!f.elements.done?.checked };
      if (ex) Object.assign(ex, data); else S.events.push({ id: uid(), comments: [], ...data });
      closeDrawer(); commit(); toast(ex ? "Événement mis à jour" : `Ajouté le ${fmtShort(data.date)} à ${fmtT(start)}`);
    },
  });
}

/* ---------- Occurrence de routine (exception ponctuelle) ---------- */
function openRoutineOcc(rid, date) {
  const r = S.routine.find(x => x.id === rid); if (!r) return;
  const key = rid + "@" + date, ov = S.overrides[key] || {};
  openDrawer({
    eyebrow: cap(fmtDate(date)), title: r.title,
    body: `<p class="muted">Horaire habituel : ${DOW_ORDER.filter(d => r.days.includes(d)).map(d => DOW[d]).join(", ")}, ${fmtT(r.start)} à ${fmtT(r.end)}. Les changements ci-dessous ne concernent que ce jour.</p>
      <div class="grid2"><label class="field"><span>Début ce jour-là</span><input class="input" type="time" name="start" value="${ov.start || r.start}"></label>
      <label class="field"><span>Fin ce jour-là</span><input class="input" type="time" name="end" value="${ov.end || r.end}"></label></div>
      <label class="row" style="min-height:44px"><input type="checkbox" name="cancel" style="width:20px;height:20px"> Pas de ${r.cat === "cours" ? "cours" : "service"} ce jour-là (le temps devient libre)</label>
      ${S.overrides[key] ? `<button type="button" class="btn sm" data-action="ov-reset" data-k="${key}">Revenir à l'horaire habituel</button>` : ""}
      <div style="border-top:1px solid var(--line);padding-top:14px"><button type="button" class="link" data-action="open-routine" data-id="${r.id}">Modifier la routine de chaque semaine</button></div>`,
    foot: `<span></span><span class="row"><button type="button" class="btn" data-action="close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></span>`,
    onSubmit(f) {
      if (f.elements.cancel.checked) S.overrides[key] = { cancel: true };
      else {
        const s = fv(f, "start"), e = fv(f, "end");
        if (toMin(e) <= toMin(s)) return toast("L'heure de fin doit être après l'heure de début.");
        if (s === r.start && e === r.end) delete S.overrides[key]; else S.overrides[key] = { start: s, end: e };
      }
      closeDrawer(); commit(); toast("Modifié pour ce jour uniquement");
    },
  });
}

/* ---------- Bloc de routine ---------- */
function openRoutine(id) {
  const ex = id ? S.routine.find(r => r.id === id) : null;
  const r = ex || { title: "", cat: "perso", days: [], start: "18:00", end: "19:00", place: "" };
  openDrawer({
    eyebrow: "Routine hebdomadaire", title: ex ? r.title : "Nouveau bloc récurrent",
    body: `<label class="field"><span>Titre</span><input class="input" name="title" value="${esc(r.title)}" placeholder="Sport, imprimerie, cours…" required autofocus></label>
      <label class="field"><span>Catégorie</span>${catSelect(r.cat)}</label>
      <div class="field"><span>Jours</span><div class="daypick">${DOW_ORDER.map(d => `<label><input type="checkbox" name="d${d}" ${r.days.includes(d) ? "checked" : ""}><span>${DOW[d]}</span></label>`).join("")}</div></div>
      <div class="grid2"><label class="field"><span>Début</span><input class="input" type="time" name="start" value="${r.start}" required></label><label class="field"><span>Fin</span><input class="input" type="time" name="end" value="${r.end}" required></label></div>
      <label class="field"><span>Lieu</span><input class="input" name="place" value="${esc(r.place || "")}"></label>`,
    foot: footSave(!!ex, "del-routine:" + (ex?.id || "")),
    onSubmit(f) {
      const days = DOW_ORDER.filter(d => f.elements["d" + d].checked);
      if (!fv(f, "title") || !days.length) return toast("Donne un titre et choisis au moins un jour.");
      if (toMin(fv(f, "end")) <= toMin(fv(f, "start"))) return toast("L'heure de fin doit être après l'heure de début.");
      const data = { title: fv(f, "title"), cat: fv(f, "cat"), days, start: fv(f, "start"), end: fv(f, "end"), place: fv(f, "place") };
      if (ex) Object.assign(ex, data); else S.routine.push({ id: uid(), ...data });
      closeDrawer(); commit(); toast("Routine enregistrée");
    },
  });
}

/* ---------- Échéance / tâche ---------- */
function openTask(id, pre = {}) {
  const ex = id ? S.tasks.find(t => t.id === id) : null;
  const t = ex || { title: "", type: pre.type || "devoir", subjectId: pre.subjectId || "", clientId: pre.clientId || "", due: pre.due || "", estimate: TASK_TYPES[pre.type || "devoir"].est, progress: 0, star: false, notes: "", checklist: [], ...pre };
  const hasCl = (t.checklist || []).length > 0;
  openDrawer({
    eyebrow: ex ? TASK_TYPES[t.type]?.label || "Échéance" : "Nouvelle échéance", title: ex ? t.title : "Devoir, projet, examen…",
    body: `<label class="field"><span>Titre</span><input class="input" name="title" value="${esc(t.title)}" placeholder="Rendu projet vidéo, test de maths…" required autofocus></label>
      <div class="grid2"><label class="field"><span>Type</span><select class="input" name="type" id="f-type">${Object.entries(TASK_TYPES).map(([k, v]) => opt(k, v.label, t.type)).join("")}</select></label>
      <label class="field"><span>Pour le</span><input class="input" type="date" name="due" value="${t.due || ""}"></label>
      <label class="field"><span>Matière</span><select class="input" name="subjectId">${opt("", "Aucune", t.subjectId)}${S.subjects.map(s => opt(s.id, s.name, t.subjectId)).join("")}</select></label>
      <label class="field"><span>Client</span><select class="input" name="clientId">${opt("", "Aucun", t.clientId)}${S.clients.map(c => opt(c.id, c.name, t.clientId)).join("")}</select></label>
      <label class="field"><span>Temps de travail estimé</span><div class="row" style="gap:8px;flex-wrap:nowrap"><input class="input num" type="number" step="0.5" min="0" name="estimate" value="${t.estimate ?? ""}"><span class="small muted">h</span></div></label>
      <label class="field"><span>Avancement ${hasCl ? "(selon la checklist)" : ""}</span><input type="range" min="0" max="100" step="5" name="progress" value="${taskProgress(t)}" ${hasCl ? "disabled" : ""} style="margin-top:14px"></label></div>
      <label class="row" style="min-height:44px"><input type="checkbox" name="star" ${t.star ? "checked" : ""} style="width:20px;height:20px"> Importante (priorité renforcée)</label>
      ${ex ? `<div class="field"><span>Étapes</span>${checklistHTML(t.checklist, "task", t.id)}</div>` : `<p class="small muted">Tu pourras découper en étapes après l'enregistrement.</p>`}
      <label class="field"><span>Notes</span><textarea class="input" name="notes" placeholder="Consignes, liens, critères…">${esc(t.notes || "")}</textarea></label>
      ${ex ? `<div class="kv small"><span>Reste à planifier</span><span class="num">${fmtDur(taskRemainingMin(t))}</span></div>` : ""}
      ${commentsBlock(ex, "task")}`,
    foot: footSave(!!ex, "del-task:" + (ex?.id || "")),
    onSubmit(f) {
      if (!fv(f, "title")) return toast("Donne un titre à l'échéance.");
      const data = { title: fv(f, "title"), type: fv(f, "type"), due: fv(f, "due"), subjectId: fv(f, "subjectId"), clientId: fv(f, "clientId"), estimate: Number(fv(f, "estimate")) || 0, star: f.elements.star.checked, notes: fv(f, "notes") };
      if (!hasCl) data.progress = Number(f.elements.progress.value) || 0;
      if (ex) Object.assign(ex, data); else S.tasks.push({ id: uid(), status: "todo", checklist: [], comments: [], createdAt: new Date().toISOString(), ...data });
      closeDrawer(); commit(); toast(ex ? "Échéance mise à jour" : "Échéance ajoutée");
    },
  });
  const typeSel = $("#f-type");
  if (typeSel && !ex) typeSel.addEventListener("change", () => { $("#drawer").elements.estimate.value = TASK_TYPES[typeSel.value].est; });
}

/* ---------- Matière ---------- */
function openSubject(id) {
  const ex = id ? S.subjects.find(s => s.id === id) : null; const s = ex || { name: "", target: "", notes: "" };
  openDrawer({
    eyebrow: "Matière", title: ex ? s.name : "Nouvelle matière",
    body: `<label class="field"><span>Nom</span><input class="input" name="name" value="${esc(s.name)}" placeholder="Programmation web, audiovisuel…" required autofocus></label>
      <label class="field"><span>À jour pour le (objectif)</span><input class="input" type="date" name="target" value="${s.target || ""}"></label>
      ${ex ? "" : `<label class="field"><span>À rattraper (un élément par ligne)</span><textarea class="input" name="items" placeholder="Chapitre 3, réseaux&#10;TP 2&#10;Cours du 29 septembre"></textarea></label>`}
      <label class="field"><span>Notes</span><textarea class="input" name="notes">${esc(s.notes || "")}</textarea></label>`,
    foot: footSave(!!ex, "del-subject:" + (ex?.id || "")),
    onSubmit(f) {
      if (!fv(f, "name")) return toast("Donne un nom à la matière.");
      const data = { name: fv(f, "name"), target: fv(f, "target"), notes: fv(f, "notes") };
      if (ex) Object.assign(ex, data);
      else S.subjects.push({ id: uid(), catchup: fv(f, "items").split("\n").map(x => x.trim()).filter(Boolean).map(text => ({ id: uid(), text, done: false })), ...data });
      closeDrawer(); commit(); toast("Matière enregistrée");
    },
  });
}

/* ---------- Client ---------- */
function openClient(id) {
  const ex = id ? S.clients.find(c => c.id === id) : null;
  const c = ex || { name: "", project: "Site web", stage: 0, deadline: "", budget: "", invoice: "none", contact: "", notes: "" };
  openDrawer({
    eyebrow: "Client", title: ex ? c.name : "Nouveau client",
    body: `<div class="grid2"><label class="field"><span>Nom</span><input class="input" name="name" value="${esc(c.name)}" required autofocus></label>
      <label class="field"><span>Projet</span><input class="input" name="project" value="${esc(c.project || "")}"></label>
      <label class="field"><span>Étape</span><select class="input" name="stage">${CLIENT_STAGES.map((l, i) => opt(i, l, c.stage || 0)).join("")}</select></label>
      <label class="field"><span>Livraison prévue</span><input class="input" type="date" name="deadline" value="${c.deadline || ""}"></label>
      <label class="field"><span>Budget</span><input class="input" name="budget" value="${esc(c.budget || "")}" placeholder="CHF 1 200"></label>
      <label class="field"><span>Facturation</span><select class="input" name="invoice">${Object.entries(INVOICE).map(([k, v]) => opt(k, v, c.invoice || "none")).join("")}</select></label></div>
      <label class="field"><span>Contact</span><input class="input" name="contact" value="${esc(c.contact || "")}" placeholder="E-mail ou téléphone"></label>
      <label class="field"><span>Notes</span><textarea class="input" name="notes" placeholder="Brief, accès, préférences…">${esc(c.notes || "")}</textarea></label>
      ${commentsBlock(ex, "client")}`,
    foot: footSave(!!ex, "del-client:" + (ex?.id || "")),
    onSubmit(f) {
      if (!fv(f, "name")) return toast("Donne un nom au client.");
      const data = { name: fv(f, "name"), project: fv(f, "project"), stage: Number(fv(f, "stage")), deadline: fv(f, "deadline"), budget: fv(f, "budget"), invoice: fv(f, "invoice"), contact: fv(f, "contact"), notes: fv(f, "notes") };
      if (ex) Object.assign(ex, data); else S.clients.push({ id: uid(), checklist: [], comments: [], ...data });
      closeDrawer(); commit(); toast("Client enregistré");
    },
  });
}

/* ---------- Candidature ---------- */
function openJob(id) {
  const ex = id ? S.jobs.find(j => j.id === id) : null;
  const j = ex || { company: "", role: "", stage: "cible", date: "", link: "", nextAction: "", nextDate: "", notes: "" };
  openDrawer({
    eyebrow: "Recherche d'emploi", title: ex ? j.company : "Nouvelle candidature",
    body: `<div class="grid2"><label class="field"><span>Entreprise</span><input class="input" name="company" value="${esc(j.company)}" required autofocus></label>
      <label class="field"><span>Poste</span><input class="input" name="role" value="${esc(j.role || "")}"></label>
      <label class="field"><span>Statut</span><select class="input" name="stage">${JOB_STAGES.map(([k, l]) => opt(k, l, j.stage)).join("")}</select></label>
      <label class="field"><span>Envoyée le</span><input class="input" type="date" name="date" value="${j.date || ""}"></label>
      <label class="field"><span>Prochaine action</span><input class="input" name="nextAction" value="${esc(j.nextAction || "")}" placeholder="Relancer, préparer l'entretien…"></label>
      <label class="field"><span>Pour le</span><input class="input" type="date" name="nextDate" value="${j.nextDate || ""}"></label></div>
      <label class="field"><span>Lien de l'annonce</span><input class="input" name="link" value="${esc(j.link || "")}" placeholder="https://"></label>
      ${j.link && /^https?:\/\//.test(j.link) ? `<a class="small" href="${esc(j.link)}" target="_blank" rel="noopener">Ouvrir l'annonce ↗</a>` : ""}
      <label class="field"><span>Notes</span><textarea class="input" name="notes" placeholder="Contact, salaire, impressions…">${esc(j.notes || "")}</textarea></label>
      ${commentsBlock(ex, "job")}`,
    foot: footSave(!!ex, "del-job:" + (ex?.id || "")),
    onSubmit(f) {
      if (!fv(f, "company")) return toast("Indique l'entreprise.");
      const data = { company: fv(f, "company"), role: fv(f, "role"), stage: fv(f, "stage"), date: fv(f, "date"), link: fv(f, "link"), nextAction: fv(f, "nextAction"), nextDate: fv(f, "nextDate"), notes: fv(f, "notes") };
      if (data.stage === "envoyee" && !data.date) data.date = todayISO();
      if (ex) Object.assign(ex, data); else S.jobs.push({ id: uid(), comments: [], ...data });
      closeDrawer(); commit(); toast("Candidature enregistrée");
    },
  });
}
</script>


<script>
"use strict";
/* =========================================================
   12. Ajout rapide, créneaux, plan, bienvenue
   ========================================================= */
function openAddMenu() {
  openDrawer({
    eyebrow: "Ajouter", title: "Qu'est-ce qu'on note ?",
    body: `<label class="field"><span>Ajout rapide</span><input class="input" id="quick-in" placeholder="RDV client jeudi 18h 1h" autocomplete="off" autofocus></label>
      <div class="quick-prev" id="quick-prev">Écris naturellement : jour, heure, durée. Je devine la catégorie.</div>
      <div><button type="button" class="btn primary" data-action="quick-go">Ajouter</button></div>
      <div class="menu-grid">
        <button type="button" data-cat="perso" data-action="new-event"><b>Rendez-vous</b><small>Avec heure de début et de fin</small></button>
        <button type="button" data-cat="etude" data-action="new-task"><b>Échéance</b><small>Devoir, projet, examen, test</small></button>
        <button type="button" data-action="find-slot"><b>Trouver un créneau</b><small>Pour caler un rendez-vous</small></button>
        <button type="button" data-cat="emploi" data-action="open-job" data-id=""><b>Candidature</b><small>Recherche d'emploi</small></button>
        <button type="button" data-cat="client" data-action="open-client" data-id=""><b>Client</b><small>Nouveau projet web</small></button>
        <button type="button" data-cat="cours" data-action="open-subject" data-id=""><b>Matière</b><small>À rattraper</small></button>
      </div>`,
  });
  const inp = $("#quick-in");
  inp.addEventListener("input", () => { $("#quick-prev").textContent = inp.value.trim().length > 2 ? describeQuick(parseQuick(inp.value)) : "Écris naturellement : jour, heure, durée. Je devine la catégorie."; });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); quickGo(); } });
}
function quickGo() {
  const v = $("#quick-in")?.value.trim(); if (!v) return;
  const r = parseQuick(v); closeDrawer();
  if (r.kind === "task") {
    S.tasks.push({ id: uid(), title: r.title, type: r.type, due: r.date || "", estimate: TASK_TYPES[r.type].est, progress: 0, status: "todo", star: false, notes: "", checklist: [], comments: [], subjectId: "", clientId: r.linkClient, createdAt: new Date().toISOString() });
    commit(); toast(`Échéance ajoutée${r.date ? " pour le " + fmtShort(r.date) : ""}`);
  } else if (!r.start) {
    openEvent(null, { title: r.title, cat: r.cat, date: r.date, clientId: r.linkClient, jobId: r.linkJob });
  } else {
    S.events.push({ id: uid(), title: r.title, cat: r.cat, date: r.date, start: r.start, end: r.end, place: "", notes: "", comments: [], taskId: "", subjectId: "", clientId: r.linkClient, jobId: r.linkJob, done: false });
    commit(); toast(`Ajouté : ${fmtShort(r.date)}, ${fmtT(r.start)} à ${fmtT(r.end)}`);
  }
}

const MOMENTS = { all: [0, 1440, "Toute la journée"], matin: [0, 720, "Matin"], aprem: [720, 1080, "Après-midi"], soir: [1080, 1440, "Soir"] };
function findSlots(dur, from, days, moment) {
  const [w0, w1] = MOMENTS[moment]; const out = [];
  for (let i = 0; i < days; i++) {
    const d = iso(addDays(from, i)); if (d < todayISO()) continue;
    for (const [a, b] of freeSlots(d, [], dur)) {

function mdLite(t) {
  if (!t) return "";
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n"); let html = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; }
    else { if (inList) { html += "</ul>"; inList = false; } if (l.trim()) html += `<p>${l.replace(/^#+\s*/, "")}</p>`; }
  }

}
function contextForAI() {
  const t = todayISO(), L = [];

    const fr = freeSlots(d).map(([a, b]) => `${fmtT(a)}-${fmtT(b)}`).join(", ") || "aucun";

  openTasks().slice(0, 40).forEach(x => L.push(`- ${x.title} (${TASK_TYPES[x.type]?.label}) ${x.due ? "pour le " + fmtDate(x.due) : "sans date"}, avancement ${taskProgress(x)}%, reste environ ${fmtDur(taskRemainingMin(x))} à planifier${x.star ? ", importante" : ""}`));
  if (S.subjects.length) { L.push("\nRATTRAPAGE :"); S.subjects.forEach(s => L.push(`- ${s.name} : ${(s.catchup || []).filter(c => !c.done).map(c => c.text).join(", ") || "à jour"}${s.target ? " (objectif " + fmtDate(s.target) + ")" : ""}`)); }
  if (S.clients.length) { L.push("\nCLIENTS :"); S.clients.forEach(c => L.push(`- ${c.name} : ${c.project || ""}, étape ${CLIENT_STAGES[c.stage || 0]}${c.deadline ? ", livraison " + fmtDate(c.deadline) : ""}, ${INVOICE[c.invoice || "none"]}`)); }

async function askAI(q) {

<script>

document.addEventListener("click", async e => {

document.addEventListener("change", e => {

document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();

document.addEventListener("keydown", e => {

    const st = obj?.state; if (!st || typeof st !== "object" || !Array.isArray(st.tasks) || !Array.isArray(st.routine)) return toast("Ce fichier n'est pas une sauvegarde du carnet.");
    openDrawer({ eyebrow: "Importer", title: "Remplacer le carnet ?", body: `<p>La sauvegarde du ${obj.exportedAt ? fmtDate(obj.exportedAt.slice(0, 10)) : "?"} contient ${st.tasks.length} échéances et ${(st.events || []).length} événements. Elle remplacera toutes les données actuelles.</p>`,
      foot: `<span></span><span class="row"><button type="button" class="btn" data-action="close">Annuler</button><button type="submit" class="btn primary">Remplacer</button></span>`,
      onSubmit() { S = migrate(st); closeDrawer(); commit(); toast("Sauvegarde importée"); } });
  };
  rd.readAsText(file);
}

async function boot() {
  renderLock("loading");
  if (!window.crypto?.subtle) return renderLock("error", "Ce navigateur ne permet pas le chiffrement. Ouvre le carnet dans un navigateur récent (Safari, Chrome, Firefox, Edge).");
  await store.init();
  let doc = null;
  try { doc = await store.read(); } catch { return renderLock("error", "Impossible de joindre ton carnet pour le moment. Vérifie ta connexion internet et réessaie."); }
  renderLock(doc ? "unlock" : "setup");
}
boot();
</script>
