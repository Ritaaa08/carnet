<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F4F1">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Carnet Privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400..800&display=swap">
<style>
/* Concept : tableau de bord d'une femme d'affaires. Neutres calmes, encre presque noire, un code couleur sourd par activité.
   Manrope pour toute l'interface ; la Didone (Bodoni Moda) est réservée à deux moments : la date du jour et l'écran verrouillé.
   Formes : cartes 14px, boutons et champs 10px, étiquettes en pilule. Thème clair assumé. */
:root{
  color-scheme:light;
  --bg:#F4F4F1; --surface:#FDFDFB; --surface-2:#EFEEEA; --line:#E3E2DD; --line-2:#D2D0CA;
  --ink:#1E1C22; --ink-2:#45424C; --muted:#6A6772; --on-ink:#FAF9F6;
  --now:#C8414F; --free:#C9C6CF;
  --urg-bg:#F5DEDB; --urg:#962E28; --soon-bg:#F2EAD3; --soon:#6B5512; --ok-bg:#DEE9E0; --ok:#2E5D45;
  --f-ui:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 1px 2px rgba(30,28,34,.04),0 10px 30px rgba(30,28,34,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for],[data-action]{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:650;text-wrap:balance;letter-spacing:-.01em}
h1 em,h2 em,h3 em{font-style:normal}
p{margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.accent{color:var(--now)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-cat]{--c:#E3E6EA;--cd:#3D4652}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:#38353F}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.soft:hover{background:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;padding:0 10px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--urg);border-color:#E2BDB9}
.btn.danger:hover{background:var(--urg-bg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.link{border:0;background:none;padding:0;font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;padding:0 14px;font-size:13.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,28,34,.1)}

/* ---------- Champs ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:650;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#97949D}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,28,34,.08)}
textarea.input{min-height:90px;resize:vertical}
input[type=range],input[type=checkbox]{accent-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:540px){.grid3{grid-template-columns:1fr 1fr}.grid2.stack-sm{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.chip.urgent{background:var(--urg-bg);color:var(--urg)}
.chip.soon{background:var(--soon-bg);color:var(--soon)}
.chip.okc{background:var(--ok-bg);color:var(--ok)}
.chip.now{background:var(--surface);color:var(--now)}
.cat-chip{background:var(--c);color:var(--cd)}
.cat-chip i{width:7px;height:7px;border-radius:50%;background:var(--cd)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{display:grid;place-items:center;width:42px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);font-size:13px;font-weight:650;color:var(--muted)}
.daypick input:checked+span{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.daypick input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- Écran verrouillé ---------- */
#lock{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lock-cover{background:var(--ink);color:var(--on-ink);padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.lock-mast{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(80px,11vw,180px);line-height:.95;letter-spacing:-.03em;padding-bottom:.08em}
.lock-quote{font-family:var(--f-display);font-style:italic;font-size:clamp(20px,2vw,26px);line-height:1.3;max-width:24ch;color:#D9D6DE}
.lock-cover .label{color:#B5B1BC}
.lock-side{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,6vw,96px) clamp(20px,6vw,96px)}
.lock-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.lock-card h2{font-size:28px;font-weight:700}
.lock-card form{display:flex;flex-direction:column;gap:14px}
.lock-note{font-size:14px;color:var(--muted)}
.lock-err{color:var(--urg);font-size:14px;min-height:1.3em;font-weight:600}
@media (max-width:820px){
  #lock{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .lock-cover{min-height:32vh;padding:24px 20px}
  .lock-mast{font-size:clamp(72px,22vw,120px)}
  .lock-side{padding:28px 20px 48px;justify-content:flex-start}
}

/* ---------- Coquille : barre latérale (ordinateur), onglets (téléphone) ---------- */
#app{min-height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:24px 14px 18px;border-right:1px solid var(--line);background:var(--surface)}
.mast{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:28px;line-height:1;padding:0 10px;border:0;background:none;text-align:left;color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;min-height:40px;padding:0 10px;border-radius:var(--r-sm);font-weight:600;font-size:14.5px;color:var(--ink-2);text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--ink);color:var(--on-ink)}
.nav svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-add{margin:0 2px}
.save-state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:0 10px}
.save-state i{width:7px;height:7px;border-radius:50%;background:#5E9A72}
.save-state.busy i{background:#C9A13B}
.save-state.err{color:var(--urg)}
.save-state.err i{background:var(--urg)}
main{min-width:0;padding-block:28px 120px;padding-inline:clamp(16px,3vw,40px)}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mob-top,.tabbar,.fab{display:none}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:12px 140px}
  .mob-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:calc(-1 * clamp(16px,3vw,40px));padding:8px clamp(16px,3vw,40px);border-bottom:1px solid var(--line)}
  .mob-top .mast{font-size:24px;padding:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:11px;font-weight:650;color:var(--muted);border-radius:var(--r-sm)}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{stroke-width:2.2}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;border:0;background:var(--ink);color:var(--on-ink);box-shadow:0 8px 22px rgba(30,28,34,.28);z-index:30}
}

/* ---------- En-têtes ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-size:clamp(26px,3vw,32px);font-weight:750;letter-spacing:-.02em}
.ph .sub{color:var(--muted);margin-top:4px}
.h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* ---------- Cartes ---------- */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
@media (max-width:1020px){.s7,.s5,.s6,.s8,.s4{grid-column:span 12}}
.card,.block-blush,.block-ink{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:var(--r-sm);color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:14px}
.empty b{color:var(--ink);font-weight:700;font-size:15px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}

/* ---------- Accueil ---------- */
.home-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.hello{color:var(--muted);font-weight:600}
.bigdate{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,6.4vw,84px);line-height:1.05;letter-spacing:-.03em;margin-top:4px;padding-bottom:.06em}
.bigdate em{font-style:italic}
.affirm{margin-top:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--ink-2)}
.affirm p{font-family:var(--f-display);font-style:italic;font-size:19px}
.cover{position:relative;container-type:inline-size;width:210px;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--ink);color:var(--on-ink);isolation:isolate}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:-2}
.cover.has-photo:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(30,28,34,.5) 0%,rgba(30,28,34,0) 38%)}
.cover-mast{position:absolute;left:0;right:0;top:6cqi;text-align:center;font-family:var(--f-display);font-weight:600;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;font-size:min(calc(88cqi / (var(--n) * .74)),30cqi);padding:0 5cqi}
.cover-add{position:absolute;left:8cqi;right:8cqi;bottom:8cqi}
.cover-add .btn{width:100%;background:rgba(250,249,246,.12);border-color:rgba(250,249,246,.35);color:var(--on-ink)}
.cover-edit{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:9px;border:0;display:grid;place-items:center;background:rgba(250,249,246,.85);color:var(--ink)}
@media (max-width:700px){
  .home-head{grid-template-columns:minmax(0,1fr) 108px;gap:14px;align-items:start}
  .cover{width:108px}
  .affirm p{font-size:17px}
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.kpi small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote-strip{overflow:hidden;border-block:1px solid var(--line);padding:9px 0;color:var(--ink-2)}
.marquee-track{display:flex;width:max-content;animation:marq 80s linear infinite}
.quote-strip:hover .marquee-track{animation-play-state:paused}
.quote-strip span{font-family:var(--f-display);font-style:italic;font-size:16px;white-space:nowrap;padding-right:22px;display:inline-flex;align-items:center;gap:22px}
.quote-strip span:after{content:"";width:4px;height:4px;border-radius:50%;background:var(--line-2)}
@keyframes marq{to{transform:translateX(-50%)}}
.interlude{margin:6px 0 0;text-align:center}
.interlude blockquote{margin:0 auto;max-width:36ch;font-family:var(--f-display);font-style:italic;font-size:clamp(20px,2.2vw,26px);line-height:1.35;color:var(--ink-2)}
.interlude blockquote.swap{animation:swap .6s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}

/* Semaine en un coup d'œil */
.glance{display:flex;flex-direction:column;gap:6px}
.gl-axis,.gl-row{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;gap:12px;align-items:center}
.gl-axis .gl-track{height:14px;background:none;border:0}
.gl-axis .gl-track span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.gl-row{border:0;background:transparent;padding:4px 0;border-radius:8px;text-align:left;width:100%}
.gl-row:hover .gl-track{border-color:var(--line-2)}
.gl-day{font-weight:700;font-size:13.5px}
.gl-day small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.gl-row.today .gl-day{color:var(--now)}
.gl-row.past{opacity:.45}
.gl-track{position:relative;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.gl-track i{position:absolute;top:3px;bottom:3px;border-radius:5px;background:color-mix(in srgb,var(--cd) 26%,var(--c));border-left:3px solid var(--cd)}
.gl-track u{position:absolute;top:3px;bottom:3px;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(201,198,207,.35) 0 5px,transparent 5px 10px)}
.gl-track em{position:absolute;top:0;bottom:0;width:2px;background:var(--now)}
.gl-meta{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.gl-meta b{color:var(--ink);font-weight:700}
.gl-meta .short{display:none}
@media (max-width:540px){.gl-meta .long{display:none}.gl-meta .short{display:inline}}
@media (max-width:540px){.gl-axis,.gl-row{grid-template-columns:44px minmax(0,1fr) 62px;gap:8px}.gl-day small{display:none}}

/* Journée (liste) */
.tl{display:flex;flex-direction:column;gap:6px}
.tl-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:stretch}
.tl-time{font-size:13px;font-weight:650;padding-top:11px;text-align:right;color:var(--muted)}
.tl-block{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-left:3px solid var(--cd);border-radius:var(--r-sm);padding:9px 12px;background:var(--c);color:var(--ink)}
.tl-block:hover{filter:brightness(.98)}
.tl-block .t{font-weight:650;font-size:14.5px;line-height:1.3}
.tl-block .m{font-size:12.5px;color:var(--cd)}
.tl-block .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;color:var(--cd);white-space:nowrap}
.tl-block.done .t{text-decoration:line-through;opacity:.6}
.tl-now .tl-time{color:var(--now)}
.tl-now .tl-block{box-shadow:0 0 0 2px var(--now)}
.tl-free{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--free);border-radius:var(--r-sm);padding:8px 12px;background:transparent;color:var(--muted);font-size:13.5px}
.tl-free:hover{background:var(--surface-2);color:var(--ink)}
.tl-free b{font-weight:700;color:var(--ink);white-space:nowrap}

/* Listes : priorités, échéances, alertes */
.top3{display:flex;flex-direction:column;gap:8px}
.top3 article{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--c);border-left:3px solid var(--cd)}
.top3 .n{font-weight:800;font-size:15px;color:var(--cd);text-align:center}
.top3 .t{font-weight:650;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere;border:0;background:none;padding:0;text-align:left}
.top3 .meta{font-size:12.5px;color:var(--cd)}
.dl{display:flex;flex-direction:column}
.dl-row{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.dl-row:first-child{border-top:0}
.dl-row:hover .t{text-decoration:underline;text-underline-offset:3px}
.dl-date{font-size:13px;font-weight:650;color:var(--ink-2)}
.dl-row .t{font-weight:650;font-size:14.5px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.dl-row .t i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--cd)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 12px;border:0;border-radius:var(--r-sm);background:var(--surface-2);text-align:left;width:100%;font-size:14px;line-height:1.4}
.alert i{width:8px;height:8px;border-radius:50%;background:var(--soon);transform:translateY(-1px)}
.alert.bad i{background:var(--urg)}
.alert:hover{background:var(--line)}

/* Tâches */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0}

.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--cd);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--on-ink);transition:background .15s}

.pbar{display:inline-block;width:56px;height:4px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}

/* Progression */

/* Assistante */

.add-inline{display:flex;gap:8px}

/* ---------- Agenda ---------- */
.ag-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.wk-scroll{overflow:auto;max-height:72vh;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}

.wk.one{min-width:0}
.wk-h{position:sticky;top:0;z-index:3;background:var(--surface);padding:10px 6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize}

.wk-h.today b{background:var(--ink);color:var(--on-ink)}
.wk-h .load{display:block;font-size:11px;font-weight:600;text-transform:none}
.wk-times{position:relative;border-right:1px solid var(--line)}
.wk-times span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--muted)}
.wk-col{position:relative;border-right:1px solid var(--line);cursor:copy}

.wk-free{position:absolute;left:3px;right:3px;border-radius:8px;border:1px dashed var(--free);background:repeating-linear-gradient(135deg,rgba(201,198,207,.18) 0 6px,transparent 6px 12px);font-size:11px;font-weight:600;color:var(--muted);padding:3px 6px;pointer-events:none;overflow:hidden}
.wk-ev{position:absolute;border:0;border-left:3px solid var(--cd);border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;background:var(--c);color:var(--ink);cursor:pointer;z-index:2;text-align:left}
.wk-ev:hover{box-shadow:var(--shadow);z-index:3}
.wk-ev b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-ev span{color:var(--cd);font-weight:600}
.wk-ev.ghost{background:var(--surface);border:1px dashed var(--cd);border-left-width:3px}

.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:4;pointer-events:none}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

/* Mois */

.m-cell{position:relative;min-height:118px;padding:6px 6px 8px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.m-cell:nth-child(7n){border-right:0}

.m-it.due{background:transparent;box-shadow:inset 0 0 0 1px var(--cd);color:var(--cd);font-weight:700}
.m-more{font-size:11px;color:var(--muted);font-weight:650;padding-left:4px}

}
.m-dots{display:none}

.day-panel{display:flex;flex-direction:column;gap:14px}

/* ---------- Onglets, filtres ---------- */
.tabs-ed{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px;align-self:flex-start}
.tabs-ed button{border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 16px;font-size:14px;font-weight:650;color:var(--muted)}

/* ---------- Projets ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.steps button i{display:block;width:100%;height:6px;border-radius:6px;background:var(--surface-2)}
.steps button.on i{background:var(--cd)}
.steps button.cur{color:var(--cd)}
.checklist{display:flex;flex-direction:column}
.ci{display:flex;gap:10px;align-items:center;font-size:14px;padding:5px 0;min-height:36px}
.ci input{width:18px;height:18px;flex:none;accent-color:var(--cd)}
.ci.done span{text-decoration:line-through;color:var(--muted)}
.ci span{flex:1;min-width:0;overflow-wrap:anywhere}
.ci .x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;opacity:.5}
.ci:hover .x,.ci .x:focus-visible{opacity:1}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface-2);border-radius:var(--r);padding:10px}

.jcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cd);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}

/* ---------- Réglages ---------- */
.photo-pick{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.photo-thumb{width:96px;aspect-ratio:4/5;border-radius:var(--r-sm);background:var(--ink);overflow:hidden;display:grid;place-items:center;color:var(--on-ink);font-family:var(--f-display);font-size:26px}

.routine-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--c);border-left:3px solid var(--cd);flex-wrap:wrap}

.colors{display:flex;flex-direction:column;gap:10px}

.color-row>span{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:999px;background:var(--c);color:var(--cd);justify-self:start}

.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;padding:0;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(30,28,34,.12)}
.swatches button.on{border-color:var(--ink)}

/* ---------- Tiroirs ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,28,34,.38);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s}
.drawer{width:min(520px,100%);height:100%;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .25s var(--ease)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h2{font-size:21px;font-weight:750;overflow-wrap:anywhere}

@keyframes fade{from{opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:up .2s var(--ease)}

/* =========================================================
   2. Chiffrement (PBKDF2 → AES-GCM, compression gzip)
   ========================================================= */
const enc = new TextEncoder(), dec = new TextDecoder();

const ITER = 400000;

async function sealState(obj, key, salt, iter, rev) {
  const json = JSON.stringify(obj);

  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain));

}

  return { fmt: 1, type: "image/jpeg", iv: b64(iv), ct: b64(ct), at: new Date().toISOString() };
}

}

/* =========================================================
   3. Stockage : Supabase (synchronisé) ou appareil (local)
   ========================================================= */
const CFG = window.CARNET_CONFIG || {};
const LS_KEY = "carnet.vault.v1", LS_PHOTO = "carnet.photo.v1", LS_VID = "carnet.vid", LS_PENDING = "carnet.pending";
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, "0")).join("");
const parseSyncCode = v => { const m = String(v || "").match(/[0-9a-f]{64}/i); return m ? m[0].toLowerCase() : ""; };
/* Synchronisation : un coffre chiffré par carnet, identifié par un code secret de 64 caractères,
   stocké dans Supabase via trois fonctions (lecture, écriture, suppression). Copie locale pour le hors ligne. */
const store = {
  mode: "loading", vid: "", timer: null, offline: false, _online: false,
  get remote() { return !!(CFG.supabaseUrl && CFG.supabaseKey); },
  async init() {
    const fromHash = parseSyncCode(location.hash);
    if (fromHash) { lsSet(LS_VID, fromHash); history.replaceState(null, "", location.pathname + location.search); }
    this.vid = lsGet(LS_VID) || "";
    this.mode = this.remote ? "cloud" : "local";
  },
  linkDevice(code) { const v = parseSyncCode(code); if (!v) return false; this.vid = v; lsSet(LS_VID, v); lsDel(LS_KEY); lsDel(LS_PENDING); return true; },
  forget() { this.vid = ""; lsDel(LS_VID); lsDel(LS_KEY); lsDel(LS_PENDING); },
  ensureVault() { if (!this.vid) { this.vid = randHex(32); lsSet(LS_VID, this.vid); } },
  syncLink() { return location.origin + location.pathname + "#k=" + this.vid; },
  async rpc(fn, body) {
    const h = { "Content-Type": "application/json", apikey: CFG.supabaseKey };
    if (String(CFG.supabaseKey).startsWith("eyJ")) h.Authorization = "Bearer " + CFG.supabaseKey;
    const r = await fetch(String(CFG.supabaseUrl).replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers: h, body: JSON.stringify(body) });
    const txt = await r.text();
    if (!r.ok) throw { code: "remote", status: r.status, message: txt };
    return txt ? JSON.parse(txt) : null;
  },
  localDoc() { try { const raw = lsGet(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } },
  async read() {
    const local = this.localDoc();

    try {
      const remote = await this.rpc("carnet_get", { p_id: this.vid });
      this.offline = false;
      if (remote && (!local || (remote.rev || 0) >= (local.rev || 0))) { lsSet(LS_KEY, JSON.stringify(remote)); lsDel(LS_PENDING); return remote; }
      return local || remote;
    } catch (e) { this.offline = true; if (!local) throw e; return local; }
  },
  async write(doc) {
    lsSet(LS_KEY, JSON.stringify(doc));
    if (this.mode !== "cloud") return { saved: "local" };
    try {
      const rev = await this.rpc("carnet_put", { p_id: this.vid, p_doc: doc });
      lsDel(LS_PENDING); this.offline = false;
      if (rev != null && Number(rev) > doc.rev) return { saved: "conflict", rev: Number(rev) };
      return { saved: "cloud" };
    } catch (e) {
      if (/volumineux/.test(e?.message || "")) throw { code: "quota_exceeded" };
      lsSet(LS_PENDING, "1"); this.offline = true; return { saved: "offline" };
    }
  },
  async readPhoto() {
    if (this.mode === "cloud" && this.vid) { try { return await this.rpc("carnet_get", { p_id: this.vid + ".photo" }); } catch {} }
    try { const raw = lsGet(LS_PHOTO); return raw ? JSON.parse(raw) : null; } catch { return null; }
  },
  async writePhoto(doc) {
    if (this.mode === "cloud") return this.rpc("carnet_put", { p_id: this.vid + ".photo", p_doc: doc });
    if (!lsSet(LS_PHOTO, JSON.stringify(doc))) throw { code: "quota_exceeded" };
  },
  async wipePhoto() {
    if (this.mode === "cloud" && this.vid) await this.rpc("carnet_delete", { p_id: this.vid + ".photo" }).catch(() => {});

  },
  async wipe() {
    await this.wipePhoto();
    if (this.mode === "cloud" && this.vid) await this.rpc("carnet_delete", { p_id: this.vid });

  },
  watch(fn) {
    if (this.mode !== "cloud" || this.timer) return;

    this._vis = () => { if (!document.hidden) check(); };
    document.addEventListener("visibilitychange", this._vis);
    window.addEventListener("focus", this._vis);
    if (!this._online) { this._online = true; window.addEventListener("online", () => { if (session && lsGet(LS_PENDING)) { dirty = true; flush(); } }); }
  },
  stop() {
    clearInterval(this.timer); this.timer = null;
    if (this._vis) { document.removeEventListener("visibilitychange", this._vis); window.removeEventListener("focus", this._vis); this._vis = null; }
  },
};

/* =========================================================
   4. État & session
   ========================================================= */
let S = null;               // état déchiffré (uniquement en mémoire)
let session = null;         // { key, salt, iter, rev }
let photoURL = "";          // photo d'ambiance déchiffrée (URL locale)
const ui = { view: "home", agMode: "week", agDate: todayISO(), agSel: todayISO(), taskFilter: "all", showDone: false, projTab: "etudes", plan: null, showFree: true };

function defaultState(name) {
  return {
    v: 1,
    settings: { name: name || "", dayStart: "07:30", dayEnd: "21:30", travel: 30, minSlot: 45, maxFocus: 3, maxSession: 2, lockMin: 10, itemMin: 60, phrases: "", colors: {}, bedtime: "23:00", windDown: 60, restDay: "", onboarded: false },
    routine: [],
    overrides: {}, breaks: [], events: [], tasks: [], subjects: [], clients: [], jobs: [],
  };
}
function migrate(st) {
  const d = defaultState("");
  st.settings = Object.assign({}, d.settings, st.settings || {});
  for (const k of ["routine", "breaks", "events", "tasks", "subjects", "clients", "jobs"]) if (!Array.isArray(st[k])) st[k] = [];
  if (!st.overrides || typeof st.overrides !== "object") st.overrides = {};
  return st;
}

let saveTimer = null, saving = Promise.resolve(), dirty = false;
function setSaveState(kind, text) {
  const el = $("#save-state"); if (!el) return;
  el.className = "save-state" + (kind ? " " + kind : ""); el.querySelector("span").textContent = text;
}
function commit(rerender = true) {
  dirty = true; setSaveState("busy", "Enregistrement…");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
  if (rerender) render();
}
function flush() {
  clearTimeout(saveTimer);
  if (!dirty || !session) return saving;
  dirty = false;
  const snapshot = JSON.parse(JSON.stringify(S));
  const sess = session;
  saving = saving.then(async () => {
    try {
      sess.rev += 1;
      const doc = await sealState(snapshot, sess.key, sess.salt, sess.iter, sess.rev);
      const res = await store.write(doc);
      if (res.saved === "conflict") {
        sess.rev = res.rev - 1;
        const remote = await store.read();
        if (remote) { await onRemote(remote, true); toast("Ton carnet a été modifié sur un autre appareil : il a été rechargé."); }
        return;
      }
      if (!dirty) setSaveState(res.saved === "offline" ? "busy" : "", res.saved === "offline" ? "Hors ligne : gardé sur cet appareil" : res.saved === "cloud" ? "Enregistré et synchronisé" : "Enregistré sur cet appareil");
      if (doc.ct.length / 1024 > 200) toast("Ton carnet approche de la taille maximale. Fais le ménage dans Réglages.");
    } catch (e) {
      dirty = true;
      setSaveState("err", e?.code === "quota_exceeded" ? "Stockage plein" : "Échec de l'enregistrement");
    }
  });

}
async function onRemote(doc, force = false) {
  if (!session || (!force && (dirty || doc.rev <= session.rev))) return;
  try {
    const st = await openState(doc, session.key);
    S = migrate(st); session.rev = doc.rev; render(); toast("Mis à jour depuis un autre appareil");
    loadPhoto();
  } catch {}
}

/* Photo d'ambiance : redimensionnée, chiffrée, stockée à part */
async function fileToJpeg(file) {
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  let max = 1400, q = 0.85, blob = null;
  for (let i = 0; i < 12; i++) {
    const s = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement("canvas"); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    if (blob && blob.size <= 170000) break;
    if (q > 0.62) q -= 0.08; else { max = Math.round(max * 0.8); q = 0.8; }
  }
  if (!blob) throw new Error("image");
  return new Uint8Array(await blob.arrayBuffer());
}
function setPhotoBytes(u8) {
  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = u8 ? URL.createObjectURL(new Blob([u8], { type: "image/jpeg" })) : "";
}
async function loadPhoto() {
  if (!session) return;
  try {
    const doc = await store.readPhoto();
    if (!doc) { if (photoURL) { setPhotoBytes(null); render(); } return; }
    const u8 = await openBytes(doc, session.key); setPhotoBytes(u8); render();
  } catch {}
}
async function savePhoto(file) {
  toast("Préparation de la photo…");
  try {
    const u8 = await fileToJpeg(file);
    await store.writePhoto(await sealBytes(u8, session.key));
    setPhotoBytes(u8); render(); if (wiz) { wizCollect($("#wizard")); renderWizard(); } toast("Photo enregistrée");
  } catch (e) {
    toast(e?.code === "quota_exceeded" ? "Stockage plein : la photo n'a pas pu être enregistrée." : "Cette image n'a pas pu être lue. Essaie une photo JPEG ou PNG.");
  }
}
async function removePhoto() { await store.wipePhoto().catch(() => {}); setPhotoBytes(null); render(); toast("Photo retirée"); }
</script>


<script>
"use strict";
/* =========================================================
   5. Logique d'agenda : occurrences, temps libre, priorités
   ========================================================= */
function inBreak(date, cat) {
  return S.breaks.some(b => b.from && b.to && date >= b.from && date <= b.to && (b.cats || ["cours"]).includes(cat));
}
function occurrences(date) {
  const dow = parseISO(date).getDay();
  const out = [];
  for (const r of S.routine) {
    if (!r.days.includes(dow)) continue;
    if (inBreak(date, r.cat)) continue;
    const ov = S.overrides[r.id + "@" + date];
    if (ov?.cancel) continue;
    out.push({ kind: "routine", id: r.id, date, title: r.title, cat: r.cat, start: ov?.start || r.start, end: ov?.end || r.end, place: r.place, modified: !!ov, meal: r.meal || "" });
  }
  const fixed = out.filter(o => !o.meal);
  for (let i = out.length - 1; i >= 0; i--) {
    const o = out[i];
    if (o.meal && fixed.some(f => toMin(f.start) < toMin(o.end) && toMin(o.start) < toMin(f.end))) out.splice(i, 1);
  }
  for (const e of S.events) if (e.date === date) out.push({ kind: "event", ...e });
  return out.sort((a, b) => toMin(a.start) - toMin(b.start));
}
function mergeIv(list) {
  const s = list.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s) { const l = out[out.length - 1]; if (l && iv[0] <= l[1]) l[1] = Math.max(l[1], iv[1]); else out.push([...iv]); }
  return out;
}
function freeSlots(date, extraBusy = [], minLen) {

const HOUR = 46;
function layoutCols(items) {
  const sorted = items.slice().sort((a, b) => a.s - b.s || b.e - a.e); let group = [], end = -1;
  const flush = () => { const cols = []; for (const it of group) { let c = cols.findIndex(e => e <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.e; it.col = c; } for (const it of group) it.cols = cols.length; group = []; };
  for (const it of sorted) { if (it.s >= end && group.length) { flush(); end = -1; } group.push(it); end = Math.max(end, it.e); }
  if (group.length) flush();
  return sorted;
}
function timeGrid(shown) {
  const st = S.settings, t = todayISO();
  const g0 = Math.min(7, Math.floor(toMin(st.dayStart) / 60)), g1 = Math.max(22, Math.ceil(toMin(st.dayEnd) / 60));
  const H = (g1 - g0) * HOUR, y = m => ((m - g0 * 60) / 60) * HOUR;
  const ghosts = ui.plan ? ui.plan.sessions.filter(s => s.on) : [];
  const head = `<div class="wk-h"></div>` + shown.map(d => {
    const fr = freeMin(d), due = dueOn(d).length;
    return `<div class="wk-h ${d === t ? "today" : ""}">${fmtDate(d, { weekday: "short" }).replace(".", "")}<b class="num">${parseISO(d).getDate()}</b><span class="load num">${d < t ? "&nbsp;" : (fr ? fmtDur(fr) + " libre" : "complet")}${due ? `, ${due} éch.` : ""}</span></div>`;
  }).join("");
  const times = `<div class="wk-times" style="height:${H}px">${[...Array(g1 - g0 + 1)].map((_, i) => i && i < g1 - g0 ? `<span style="top:${i * HOUR}px">${g0 + i}h</span>` : "").join("")}</div>`;
  const cols = shown.map(d => {
    const occ = occurrences(d).map(o => ({ o, s: toMin(o.start), e: Math.max(toMin(o.end), toMin(o.start) + 15) }));
    const gh = ghosts.filter(s => s.date === d).map(s => ({ o: { ...s, kind: "ghost", id: s.pid }, s: toMin(s.start), e: toMin(s.end) }));
    const laid = layoutCols(occ.concat(gh));
    const lines = [...Array(g1 - g0)].map((_, i) => `<div class="hl" style="top:${i * HOUR}px"></div>`).join("");
    const free = ui.showFree ? freeSlots(d).map(([a, b]) => `<div class="wk-free" style="top:${y(a) + 2}px;height:${y(b) - y(a) - 4}px">${b - a >= 45 ? "libre " + fmtDur(b - a) : ""}</div>`).join("") : "";
    const evs = laid.map(({ o, s, e, col, cols }) => {
      const h = Math.max(y(e) - y(s) - 2, 18), w = 100 / cols;
      return `<button type="button" class="wk-ev ${o.kind === "ghost" ? "ghost" : ""} ${o.done ? "done" : ""}" data-cat="${o.cat}" data-action="open-occ" data-kind="${o.kind}" data-id="${o.id}" data-date="${d}"
        style="top:${y(s) + 1}px;height:${h}px;left:calc(${col * w}% + 3px);width:calc(${w}% - 6px)"><b>${esc(o.title)}</b>${h > 32 ? `<span class="num">${fmtT(o.start)} à ${fmtT(o.end)}</span>` : ""}</button>`;
    }).join("");
    const nowL = d === t && nowMin() >= g0 * 60 && nowMin() <= g1 * 60 ? `<div class="wk-now" style="top:${y(nowMin())}px"></div>` : "";
    return `<div class="wk-col" data-action="grid-click" data-date="${d}" data-g0="${g0}" style="height:${H}px">${lines}${free}${evs}${nowL}</div>`;
  }).join("");
  return `<div class="wk-scroll" id="wk-scroll"><div class="wk ${shown.length === 1 ? "one" : ""}" style="grid-template-columns:48px repeat(${shown.length},minmax(0,1fr))">${head}${times}${cols}</div></div>`;
}
